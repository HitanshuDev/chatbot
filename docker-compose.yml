services:
  backend:
    build:
      context: ./backend
      target: development
    container_name: chatbot-backend
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      MONGO_URI: ${MONGO_URI:?set MONGO_URI in .env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      PORT: 5000
      NODE_ENV: development
      API_URL: http://localhost:5000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: http://localhost:3000/auth/google/callback
    networks:
      - chatbot-network
    volumes:
      - ./backend:/app
      # Anonymous volume keeps the container's Linux-built node_modules from
      # being masked by the host's macOS-built ones (bcrypt is native).
      - /app/node_modules
    command: pnpm dev

  # Consumes the Bull "embeddings" queue. Shares the backend image.
  embedding-worker:
    build:
      context: ./backend
      target: development
    container_name: chatbot-embedding-worker
    environment:
      MONGO_URI: ${MONGO_URI:?set MONGO_URI in .env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      NODE_ENV: development
    networks:
      - chatbot-network
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: pnpm worker:embedding

  frontend:
    build:
      context: ./frontend
    container_name: chatbot-frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/v1
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - backend
    networks:
      - chatbot-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: pnpm dev

networks:
  chatbot-network:
    driver: bridge
